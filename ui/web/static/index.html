<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>REINFORCE Maze Lab</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <main class="shell">
            <header class="topbar">
                <div>
                    <p class="eyebrow">REINFORCE Maze Lab</p>
                    <h1>Draw a maze, statistics wants to look smart.</h1>
                </div>
                <button id="trainButton">Train</button>
            </header>

            <section class="workspace">
                <aside class="panel">
                    <div class="tool-row" role="group" aria-label="Brushes">
                        <button class="tool active" data-brush="1">Wall</button>
                        <button class="tool" data-brush="2">Start</button>
                        <button class="tool" data-brush="3">End</button>
                        <button class="tool" data-brush="0">Erase</button>
                    </div>

                    <div class="controls">
                        <label
                            >Epochs
                            <input
                                id="epochs"
                                type="number"
                                value="120"
                                min="1"
                                max="500"
                        /></label>
                        <label
                            >Batch
                            <input
                                id="batch"
                                type="number"
                                value="64"
                                min="1"
                                max="500"
                        /></label>
                        <label
                            >Limit
                            <input
                                id="limit"
                                type="number"
                                value="100"
                                min="1"
                                max="500"
                        /></label>
                        <label
                            >Seed
                            <input
                                id="seed"
                                type="number"
                                placeholder="optional"
                        /></label>
                    </div>

                    <button id="resetButton" class="secondary">
                        Reset Maze
                    </button>
                    <button id="randomButton" class="secondary">
                        Random Maze
                    </button>
                    <p id="message" class="message">
                        Start and end belong in the border padding.
                    </p>
                </aside>

                <section class="board-wrap">
                    <div
                        id="board"
                        class="board"
                        aria-label="Maze editor"
                    ></div>
                </section>

                <aside class="panel stats">
                    <div class="progress-shell">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <dl>
                        <div>
                            <dt>Status</dt>
                            <dd id="status">Idle</dd>
                        </div>
                        <div>
                            <dt>Epochs</dt>
                            <dd id="statEpochs">0</dd>
                        </div>
                        <div>
                            <dt>Success</dt>
                            <dd id="statSuccess">0%</dd>
                        </div>
                        <div>
                            <dt>Avg Return</dt>
                            <dd id="statAvg">0.000</dd>
                        </div>
                        <div>
                            <dt>Best Return</dt>
                            <dd id="statBest">0.000</dd>
                        </div>
                        <div>
                            <dt>Path</dt>
                            <dd id="statPath">-</dd>
                        </div>
                        <div>
                            <dt>Seconds</dt>
                            <dd id="statSeconds">0.00</dd>
                        </div>
                    </dl>
                </aside>
            </section>
        </main>
        <script src="/app.js"></script>
    </body>
</html>
